name: Python lint

on: workflow_call

jobs:
  black:
    name: Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to requirements.txt rather than psf/black@stable: a floating
      # action version reformats on Black's release schedule, not ours.
      - name: Install Black
        run: python -m pip install "$(grep '^black==' requirements.txt)"
      - name: Black
        run: black --check .

  stale-docs:
    name: Published docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib only, so no install step. Exit 1 = a published page still briefs a
      # removed feature; exit 2 = a row in the audit's own table is inert and has
      # been checking nothing (three were, until 2026-09-07).
      - name: Audit published docs for removed features
        run: python tools/audit_stale_docs.py

  dead-code:
    name: Dead code (advisory)
    runs-on: ubuntu-latest
    # Advisory like luacheck: a finding is reported, never blocks. The tree was
    # cleaned to zero on 2026-09-23, so any count here is new since then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyflakes and vulture
        run: python -m pip install pyflakes==4.0.0 vulture==2.16
      - name: Unused imports and names
        run: |
          set -o pipefail
          python tools/dead_code_report.py | tee dead-code.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Dead code"
            echo '```'
            cat dead-code.txt 2>/dev/null || echo "report did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lua-syntax:
    name: Lua 5.1 syntax
    runs-on: ubuntu-latest
    # DCS runs Lua 5.1, and a plugin that fails to parse dies silently in the
    # mission. Blocking, so a broken file cannot reach the latest release.
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse every plugin Lua file (luac5.1 -p)
        run: |
          set -uo pipefail
          status=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! out=$(luac5.1 -p "$f" 2>&1); then
              echo "::error file=$f::$out"
              status=1
            fi
          done < <(find resources/plugins -name '*.lua' -print0)
          echo "Parsed $count plugin Lua file(s) under Lua 5.1."
          exit $status

  luacheck:
    name: luacheck (advisory)
    runs-on: ubuntu-latest
    # Every RetLab-authored plugin; .luacheckrc excludes what we did not write.
    # Always green: the counts go to the Step Summary, never a red check.
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: luacheck resources/plugins
        run: |
          set +e
          luacheck resources/plugins > luacheck.txt 2>&1
          code=$?
          cat luacheck.txt
          {
            echo "### luacheck (advisory), exit $code"
            echo '```'
            grep -E "^Total:" luacheck.txt || echo "no total line"
            echo
            echo "Files with findings:"
            grep -E "^Checking .* [0-9]+ (warning|error)" luacheck.txt | sed -E 's/^Checking //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  mypy:
    name: Type checking
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: mypy
        uses: ./.github/actions/mypy
