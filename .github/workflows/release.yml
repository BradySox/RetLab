name: Release Pipeline

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    # The Codecov upload in test.yml needs id-token; without this grant the
    # run fails at startup.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      id-token: write

  # Build and publish in one job: passing the build between jobs needs
  # upload-artifact, which fails while the Actions storage quota is full.
  release:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: Set up JS environment
        uses: ./.github/actions/setup-liberation-js

      - name: Finalize build
        run: |
          New-Item -ItemType file resources\final

      - name: Build app
        uses: ./.github/actions/build-app
        with:
          release: true

      - name: "Get Version"
        id: version
        env:
          TAG_NAME: ${{ github.ref }}
        run: |
          $version = ($env:TAG_NAME -split "/") | Select-Object -Last 1
          $prerelease = ($version -match '[^\.\d]').ToString().ToLower()
          Write-Host $version
          Write-Host $prerelease
          Write-Output "number=$version" >> $env:GITHUB_OUTPUT
          Write-Output "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path .\dist\dcs-retribution -DestinationPath "dist\retlab-$version.zip" -Compression Optimal

      # A release page takes at most 125,000 characters. docs/releases/<tag>.md
      # is the short summary; without one, the top changelog block is cut to fit.
      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          link="Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/changelog.md"
          if [ -f "docs/releases/${VERSION}.md" ]; then
            { cat "docs/releases/${VERSION}.md"; echo; echo "$link"; } > releasenotes.md
          else
            { sed '1s/^\xEF\xBB\xBF//' changelog.md | awk '/^# /{n++} n==1' | head -c 100000; echo; echo; echo "$link"; } > releasenotes.md
          fi
          wc -c releasenotes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ steps.version.outputs.number }}
          body_path: releasenotes.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/retlab-${{ steps.version.outputs.number }}.zip
