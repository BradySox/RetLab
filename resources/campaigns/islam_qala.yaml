---
name: Afghanistan - Islam Qala
theater: Afghanistan
authors: 414th Joint Fighter Group
recommended_player_faction: USA 1990
recommended_enemy_faction: Iran 1998
description: >-
  <p><strong>October 1998. Iran did not stand down.</strong></p>
  <p>In August the Taliban took Mazar-i-Sharif and killed eight Iranian diplomats in
  their own consulate. Tehran put two hundred thousand men on the border and told the
  world what would happen next. In the real world it stopped there. Here it did not:
  the IRGC crossed at Islam Qala, took Herat, Shindand and Farah in eleven days, and
  pushed a mechanised column up the Hari Rud into the central highlands.</p>
  <p>You are the other expedition. American ground forces went into eastern Afghanistan
  after the embassy bombings, when the cruise missiles of Infinite Reach turned out not
  to be the end of it. Your airhead is <strong>Bagram and Kabul</strong>. The Iranian
  spearhead is dug in at <strong>Chaghcharan, 195 nm away</strong>, and Herat is
  <strong>347 nm</strong> — every strike is a tanker plan before it is a target plan.</p>
  <p><strong>Two roads west, and a third the long way round.</strong> The Hari Rud runs
  through the highlands from Bamyan to Chaghcharan to Herat: short, unpaved, and the
  Iranians are already sitting on the middle of it. North of that, Qala i Naw sits
  55 nm from Herat — take that field and the war stops being about fuel. South, the
  Ring Road goes through Ghazni and Tarinkot and takes forever.</p>
  <p><strong>Both sides fly Tomcats.</strong> The IRIAF F-14As are the Shah's, kept
  alive for twenty years without American parts, and half of what flies beside them is
  Iraqi — Su-24MKs, Mirage F1EQs and Fitters that landed in Iran in 1991 and never went
  home. Iran has <strong>no tanker and no AWACS</strong>, because Iran had neither. Its
  entire air picture is ground radar, and there is nothing airborne to fall back on when
  you take that away. Its SAM belt is I-Hawk, S-75, S-200, HQ-2, SA-6 and Rapier: real
  enough to make SEAD a job, with nothing in it you cannot beat.</p>
  <p>The boat is a long way off and carries tankers and a Hawkeye. It is fuel, not a
  second airfield. You fight this one from Kabul.</p>
miz: islam_qala.miz
performance: 2
recommended_start_date: 1998-10-12
version: "10.9"

# Comms towers, power sources and command centres are authored into the miz by
# tools/build_islam_qala_miz.py, so the network wires in range mode rather than
# from an explicit iads_config. That is what gives §51 comms jamming, §52
# decapitation and the bombed-power-station rule something to act on -- worth
# having in a campaign whose whole shape is SEAD and reach.
advanced_iads: true

settings:
  squadron_start_full: true
  # 1998 kit. Without this the Vipers carry JDAM (1999) and JSOW (1999) and the
  # reach problem solves itself with standoff weapons that did not exist yet.
  restrict_weapons_by_date: true
  restrict_props_by_date: true
  # Default true, preseeded because a host's saved settings layer sits UNDER
  # campaign preseeds: a Default.zip with these off strips the tanker bridge a
  # 347 nm campaign is built around.
  autoplan_tankers_for_strike: true
  autoplan_tankers_for_oca: true
  autoplan_tankers_for_dead: true

# The three axes, each tracing the real road network -- the corridor you would
# actually drive, never a straight line over a ridge. Generated by
#   python tools/supply_route_geo.py islam_qala
# from real road-junction lat/lon; edit the ISLAM_QALA_ROUTES table there and
# regenerate rather than hand-editing the numbers below.
#
# The southern axis runs its intermediates through Kandahar city, which is
# deliberately NOT a control point: a base 250 nm from Herat against Kabul's 347
# would win every auto-planner comparison and bench the eastern airhead. Routes
# bind by first and last waypoint only, so the intermediates are free.
supply_routes:
  # Bagram -> Kabul  (the Kabul-Charikar highway, 26 nm)
  - waypoints:
      - [125344, 272394]
      - [111280, 271816]
      - [82815, 270144]
  # Kabul -> Bamyan  (Charikar, up the Ghorband valley, over the Shibar Pass)
  - waypoints:
      - [82815, 270144] #Kabul CP
      - [103216, 267716] #N of Kabul
      - [131937, 263178] #Charikar
      - [134613, 233665] #Ghorband valley
      - [124514, 192981] #Ghorband, upper
      - [115852, 154924] #Shibar Pass
      - [102788, 140590] #Bamyan CP
  # Bamyan -> FOB Yakawlang  (the central highlands track, unpaved)
  - waypoints:
      - [102788, 140590]
      - [100654, 116206]
      - [97228, 88830]
      - [91773, 64280]
  # FOB Yakawlang -> Chaghcharan  (west through Lal wa Sarjangal)
  - waypoints:
      - [91773, 64280]
      - [74761, 25436]
      - [65105, 2789]
      - [64828, -43156]
      - [63224, -91681]
  # Chaghcharan -> Herat  (down the Hari Rud through Obeh -- the road the Iranian column came up)
  - waypoints:
      - [63224, -91681] #Chaghcharan CP
      - [58961, -162439] #Hari Rud valley
      - [41597, -226575] #Hari Rud valley
      - [43537, -285439] #Obeh
      - [35804, -327757] #Hari Rud, lower
      - [25821, -371275] #Herat CP
  # Chaghcharan -> Qala i Naw  (north-west across the Band-e Turkestan foothills)
  - waypoints:
      - [63224, -91681]
      - [87138, -135389]
      - [102849, -199649]
      - [113550, -245399]
      - [111818, -289403]
  # Qala i Naw -> Herat  (the Karukh road)
  - waypoints:
      - [111818, -289403] #Qala i Naw CP
      - [85667, -309303] #Karukh road
      - [55803, -338717] #Karukh
      - [25821, -371275] #Herat CP
  # Kabul -> Ghazni Heliport  (Highway 1 south through Maidan Shar)
  - waypoints:
      - [82815, 270144] #Kabul CP
      - [62509, 239721] #Maidan Shar
      - [19504, 228286] #Sayedabad
      - [-17157, 209844] #N of Ghazni
      - [-39286, 203022] #Ghazni CP
  # Ghazni Heliport -> Tarinkot  (Highway 1 to Qalat, then the Uruzgan road)
  - waypoints:
      - [-39286, 203022] #Ghazni CP
      - [-86144, 166642] #Highway 1
      - [-167114, 94982] #Highway 1
      - [-200364, 67910] #Qalat
      - [-164830, 688] #Uruzgan road
      - [-148525, -31352] #Tarinkot CP
  # Tarinkot -> Farah  (down to Kandahar, then Highway 1 west via Delaram)
  - waypoints:
      - [-148525, -31352] #Tarinkot CP
      - [-183222, -64751] #Deh Rawud road
      - [-259260, -43055] #Kandahar city
      - [-262754, -171131] #Gereshk
      - [-204734, -260535] #Delaram
      - [-178644, -378452] #Farah CP
  # Farah -> Shindand  (Highway 1 north)
  - waypoints:
      - [-178644, -378452]
      - [-130258, -375052]
      - [-97034, -370134]
      - [-64594, -368872]
  # Shindand -> Herat  (Highway 1 north through Adraskan)
  - waypoints:
      - [-64594, -368872] #Shindand CP
      - [-37177, -367848] #Adraskan
      - [-8301, -374116] #Highway 1
      - [25821, -371275] #Herat CP

squadrons:
  # ---------------------------------------------------------------- BLUE ----
  # Bagram (187 stands) - air superiority, the heavies, and the tanker bridge.
  16:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - F-15C Eagle
      size: 16
    - primary: Armed Recon
      secondary: any
      aircraft:
        - F-15E Strike Eagle (Suite 4+)
      size: 12
    - primary: Strike
      secondary: any
      aircraft:
        - B-52H Stratofortress
      size: 4
    - primary: AEW&C
      aircraft:
        - E-3A
      size: 2
    - primary: Refueling
      aircraft:
        - KC-135 Stratotanker
      size: 3
    - primary: Transport
      secondary: any
      aircraft:
        - C-130J-30
      size: 4

  # Kabul (192 stands) - the SEAD field. Everything that has to survive an
  # I-Hawk belt at the end of a 347 nm transit launches from here.
  17:
    - primary: DEAD
      secondary: any
      aircraft:
        - F-16CM Fighting Falcon (Block 50)
      size: 12
    - primary: SEAD
      secondary: any
      aircraft:
        - F/A-18C Hornet (Lot 20)
      size: 12
    - primary: SEAD Escort
      secondary: any
      aircraft:
        - EA-6B Prowler
      size: 6
    - primary: CAS
      secondary: air-to-ground
      aircraft:
        - A-10A Thunderbolt II
      size: 12
    - primary: Strike
      secondary: any
      aircraft:
        - F-14B Tomcat
      size: 12
    - primary: Escort
      secondary: air-to-air
      aircraft:
        - F-15C Eagle
      size: 12

  # Bamyan (5 stands) - forward FARP, rotary only. 70 nm from Kabul and 110 from
  # the spearhead, which makes it the thing Iran is driving at. Sized to the ramp.
  18:
    - primary: CAS
      secondary: any
      aircraft:
        - AH-64A Apache
      size: 4

  # Ghazni Heliport (10 stands) - the southern shoulder.
  21:
    - primary: Armed Recon
      secondary: any
      aircraft:
        - AH-64A Apache
      size: 4
    - primary: CAS
      secondary: any
      aircraft:
        - OH-58D(R) Kiowa Warrior
      size: 4

  # CVN-74 Stennis, Arabian Sea. Historically accurate -- Stennis deployed to the
  # Gulf in 1998 -- and 599 nm from Herat.
  #
  # SUPPORT ONLY, and this is load-bearing rather than stylistic. See the design
  # note's decision 1: the boat exists so a 347 nm war has fuel, not as a second
  # airfield. Guarded by test_carrier_flies_no_combat_aircraft.
  CVN-74 John C. Stennis:
    - primary: Refueling
      aircraft:
        - A-6E Tanker
      size: 4
    - primary: AEW&C
      aircraft:
        - E-2C Hawkeye
      size: 2

  # ----------------------------------------------------------------- RED ----
  # Herat (36 stands) - the IRIAF fighter base. The Shah's Tomcats and the
  # MiG-29s Iran bought in 1990, some of which flew in from Iraq in 1991.
  1:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - F-14A Tomcat (Block 95-GR Export)
      size: 12
    - primary: Escort
      secondary: air-to-air
      aircraft:
        - MiG-29A Fulcrum-A
      size: 12

  # Shindand (52 stands) - the strike base, and it is mostly Iraqi.
  3:
    - primary: Strike
      secondary: air-to-ground
      aircraft:
        - Su-24MK Fencer-D
      size: 12
    - primary: DEAD
      secondary: any
      aircraft:
        - F-4E Phantom II
      size: 12
    - primary: BAI
      secondary: air-to-ground
      aircraft:
        - Mirage-F1EQ
      size: 8
    - primary: Transport
      secondary: any
      aircraft:
        - IL-76MD
      size: 2

  # Shindand Heliport (42 stands) - Iran's attack helicopter is the AH-1J. It
  # never operated Hinds, which is why there are none here.
  14:
    - primary: CAS
      secondary: any
      aircraft:
        - AH-1J SeaCobra
      size: 6
    - primary: Air Assault
      secondary: any
      aircraft:
        - Mi-17 Hip
      size: 4

  # Qala i Naw (15 stands) - 55 nm from Herat. The field that decides the air war
  # if blue ever takes it.
  6:
    - primary: CAS
      secondary: air-to-ground
      aircraft:
        - F-5E Tiger II
      size: 8
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - MiG-21bis Fishbed-N
      size: 4

  # Chaghcharan (3 stands) - the spearhead. Rotary only, and sized to the ramp:
  # its value to Iran is the road, not the runway.
  5:
    - primary: Air Assault
      secondary: any
      aircraft:
        - Mi-17 Hip
      size: 2

  # Farah (3 stands) - a strip on the Ring Road.
  2:
    - primary: CAS
      secondary: air-to-ground
      aircraft:
        - Su-25 Frogfoot
      size: 2

  # Tarinkot (33 stands) - the southern shoulder. More Iraqi hardware.
  9:
    - primary: BAI
      secondary: air-to-ground
      aircraft:
        - Su-22M4 Fitter-K
      size: 12
