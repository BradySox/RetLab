name: Caucasus - Iron Gate
theater: Caucasus
authors: Plob, RetLab
description: >-
  <p><strong>Note -</strong> Built by RetLab from Plob's Northern Russia, which still
  ships unchanged. Every unit is stock DCS.</p>
  <p>In June 2018, Russian armor came through the eastern mountains and took Tbilisi.
  Georgia is cut in half. The Likhi range is the gate between the half Russia holds and
  the half you still do, and the Rikoti Pass is the hinge it turns on.</p>
  <p>None of your fields is comfortable. Kutaisi sits 27 miles from the pass and is full
  of helicopters, with every rotary stand spoken for. The strike wing of Strike Eagles,
  Vipers and Warthogs works out of Kobuleti, 55 miles back, and the Eagles are further
  back again at Batumi on the Turkish border, with no room for a single replacement. The
  tankers and the AWACS come out of Turkish airspace and never land. Offshore, a carrier
  air wing of Tomcats and Hornets waits.</p>
  <p>Against you is the modern Russian air force, with Flankers, Fulcrums, Foxhounds and
  Frogfoots across five fields under an S-300 belt. They outnumber you on the ground,
  and they know where all three of your runways are. Take the pass back.</p>
recommended_player_faction: Bluefor Modern
recommended_enemy_faction: Russia 2020
recommended_start_date: 2018-06-13
