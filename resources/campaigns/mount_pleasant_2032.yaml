---
name: Falklands - Mount Pleasant 2032
theater: Falklands
authors: RetLab
recommended_player_faction: UK-US Falklands Garrison 2032
recommended_enemy_faction: Argentina 2032
description:
  <p>November 2032, fictional. A rearmed Argentina has tried again. Its marines
  came ashore at San Carlos and its paratroops took the strip at Goose Green, and
  their HQ-7 batteries are already up. The garrison holds Mount Pleasant and
  Stanley, with Sky Sabre, a Type 45 offshore, and a US Air Force detachment of
  F-16s and F-15Es that was on the islands for an exercise. The AWACS and tankers
  come from Ascension. The rest is a long way off.</p>
  <p>Hold Mount Pleasant and push them off the islands. Clear Goose Green and San
  Carlos and the war is won. Lose Mount Pleasant and it is lost. The Argentine
  F-16s and Skyhawks fly 360 to 430 NM from the mainland, and the mainland
  fields cannot be taken. Chile is not in this war and will warn you once.</p>
  <p>Play it from either side. New Game's Invert Sides gives you the Argentine
  landing, with the win and loss rules turned round.</p>
  <p>Needs the CurrentHill UK asset pack and the community A-4E Skyhawk mod. Both
  are ticked under Mods at New Game already.</p>
miz: mount_pleasant_2032.miz
performance: 1
recommended_start_date: 2032-11-15
version: "10.9"
settings:
  squadron_start_full: true
  # Ticks the New Game mod boxes: Sky Sabre, Stormer and the ships, and the A-4ARs.
  ukmilitaryassetspack: true
  a4_skyhawk: true
  # §98: Chile holds no airfield, so it reads as uninvolved and stands border SAMs.
  neutral_border_defense: true
  # The mainland fields are 360 to 432 NM from the island fields; 440 opens the
  # islands to them.
  max_mission_range_planes: 440
victory:
  description: "Clear the islands. Hold Mount Pleasant."
  win_when:
    - label: "The landing is thrown back"
      capture_cps: [Goose Green, San Carlos FOB]
  lose_when:
    - label: "Mount Pleasant falls"
      lose_cps: [Mount Pleasant]
