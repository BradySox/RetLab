---
name: Caucasus - Black Sea Coast 1985
theater: Caucasus
authors: RetLab
recommended_player_faction: Blufor Late Cold War (80s)
recommended_enemy_faction: Russia 1980
description:
  <p><strong>Note -</strong> This campaign was designed for the F-4E Phantom II and
  the F-14A Tomcat. Every unit is stock DCS.</p>
  <p>In the spring of 1985 Tbilisi rose. The Georgian Communist Party declared the
  republic sovereign, the Transcaucasus Military District split along national lines,
  and Turkey opened its bases and the Bosporus to NATO. By the end of April USAF
  Phantoms were on the ramp at Senaki and Vaziani, and a Forrestal-class carrier was
  in the Black Sea. Moscow answered by moving the North Caucasus Military District to
  the border at the Enguri.</p>
  <p>The Soviets hold the coast from Gali to Novorossiysk. MiG-23s fly from Sukhumi,
  Gudauta and Sochi, the Fulcrums sit at Maykop, and the Fencers and Backfires wait
  at Krasnodar and Krymsk. An SA-2, SA-3 and SA-6 belt guards every base on the coast
  road, and the front's headquarters at Krasnodar runs it all.</p>
  <p>Drive up the coast road through Sukhumi and Sochi, over the hills from Tuapse,
  and take both Krasnodar fields. Lose Senaki, and Georgia falls with it.</p>
miz: black_sea_coast_1985.miz
performance: 1
recommended_start_date: 1985-05-03
version: "10.9"
# The Soviet net is wired by range from the .miz's command centres, comms towers and
# power sources. NATO has no nodes.
advanced_iads: true
settings:
  squadron_start_full: true
  # 1985: AIM-9L/9M, AIM-7F/7M, AIM-54A, AGM-45, AGM-78 and HARM yes; AMRAAM no.
  restrict_weapons_by_date: true
  restrict_props_by_date: true
  plugins:
    skynetiads: true
# Who the map's neighbours sided with in 1985. Without this, every country with
# no field on the map reads neutral and fires on both sides.
neutral_border_postures:
  Turkey: blue
  Armenia: red
  Azerbaijan: red
  Ukraine: red
victory:
  description: "Take both Krasnodar fields. Hold Senaki."
  win_when:
    - label: "The North Caucasus front loses its headquarters"
      capture_cps: [Krasnodar-Center, Krasnodar-Pashkovsky]
  lose_when:
    - label: "Senaki falls"
      lose_cps: [Senaki-Kolkhi]
squadrons:
  # ================================ NATO ================================
  # Senaki: the Phantoms, closest to the front.
  Senaki-Kolkhi:
    - primary: DEAD
      secondary: any
      aircraft:
        - 23rd Tactical Fighter Squadron
      size: 16
    - primary: SEAD
      secondary: any
      aircraft:
        - 480th TFS (Spangdahlem)
      size: 8
  # Kutaisi: Eagles and Warthogs.
  Kutaisi:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 22nd Tactical Fighter Squadron
      size: 8
    - primary: CAS
      secondary: any
      aircraft:
        - 510th Tactical Fighter Squadron
      size: 8
  # Tbilisi: the tankers and the AWACS, out of reach.
  Tbilisi-Lochini:
    - primary: Refueling
      aircraft:
        - KC-135 Stratotanker
      size: 2
    - primary: AEW&C
      aircraft:
        - 960th AAC Squadron
      size: 2
  Vaziani:
    - primary: Transport
      secondary: any
      aircraft:
        - CH-47D
      size: 4
  # The carrier: a 1985 Forrestal air wing.
  BSC-CV:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - VF-11
      size: 12
    - primary: Fighter sweep
      secondary: air-to-air
      aircraft:
        - VF-33
      size: 12
    - primary: Strike
      secondary: any
      aircraft:
        - VA-85
      size: 10
    - primary: AEW&C
      aircraft:
        - VAW-122
      size: 2
    - primary: Refueling
      aircraft:
        - VA-34 (Tanker)
      size: 4
  # The LHA: the Marines' lift up the coast.
  BSC-LHA:
    - primary: Air Assault
      secondary: any
      aircraft:
        - CH-53E
      size: 6
    - primary: Transport
      secondary: any
      aircraft:
        - UH-1H Iroquois
      size: 6
  # ============================= Soviet Union ===========================
  # Sukhumi: the closest field to the Enguri.
  Sukhumi-Babushara:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 33rd Fighter Aviation Regiment
      size: 8
    - primary: Anti-ship
      secondary: any
      aircraft:
        - 4th Guards Naval Assault Aviation Regiment
      # Babushara has five stands wide enough for a Fencer.
      size: 4
  # Gudauta: Fishbeds.
  Gudauta:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 115th GvIAP Fighter Regiment
      size: 12
  # Sochi: Floggers, Frogfoots and Hinds.
  Sochi-Adler:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 35th Fighter Aviation Regiment
      size: 12
    - primary: CAS
      secondary: any
      aircraft:
        - 357th Assault Aviation Regiment
      size: 12
    - primary: CAS
      secondary: any
      aircraft:
        - 336th Independent Combat Helicopter Regiment
      size: 8
  # Maykop: the coast's only Fulcrums, and Fitters.
  Maykop-Khanskaya:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 85th Guards Fighter Aviation Regiment
      size: 8
    - primary: BAI
      secondary: any
      aircraft:
        - 20th Guards Fighter-Bomber Aviation Regiment
      size: 12
  # Krasnodar: Floggers and Fencers at the front's headquarters.
  Krasnodar-Center:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 73rd Guards Fighter Aviation Regiment
      size: 12
    - primary: Strike
      secondary: any
      aircraft:
        - 11th Guards Bomber Aviation Regiment
      size: 12
  Krasnodar-Pashkovsky:
    - primary: Transport
      secondary: any
      aircraft:
        - 239th Independent Helicopter Regiment
      size: 6
  # Krymsk: the rear, with the Backfires watching the carrier.
  Krymsk:
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - MiG-25PD Foxbat-E
      size: 8
    - primary: Anti-ship
      secondary: any
      aircraft:
        - 924th Guards Naval Missile-Carrier Aviation Regiment
      size: 6
    - primary: AEW&C
      aircraft:
        - A-50
      size: 2
    - primary: Refueling
      aircraft:
        - IL-78M
      size: 2
