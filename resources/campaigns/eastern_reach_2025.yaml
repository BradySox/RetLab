---
name: Persian Gulf - Eastern Reach 2025
theater: Persian Gulf
authors: RetLab
recommended_player_faction: USA 2020
recommended_enemy_faction: "[CH] Iran 2025"
description: >-
  <p><strong>Note -</strong> Built for CurrentHill's Iran and USA Asset Packs and the
  RetLab Iran Air Defense Pack; New Game ticks all three, and without them Iran loses
  its Bavar-373 and 3rd Khordad batteries and its missile launchers.</p>
  <p>In the spring of 2025, Iranian missile boats sank two tankers off Jask and a
  Kheibar fired from the hills above Jiroft struck the port at Fujairah. Washington
  answered from the east, away from the mines and guns of the Strait of Hormuz. A
  Marine expeditionary unit came ashore at Bandar-e-Jask, and its airfield is now the
  American beachhead.</p>
  <p>The launchers are inland. The highway north from Jask runs through Sirik and
  Minab, up the valley past Kahnuj to Jiroft, and over the Jebal Barez pass to Kerman,
  where the Revolutionary Guard keeps its missile works and Iran's best fighters. Every
  strike on Kerman is flown 300 nautical miles or more from the Emirates, and every
  one of them needs a tanker.</p>
  <p>Take Kerman and the war is won. Lose Jask, and it is over.</p>
miz: eastern_reach_2025.miz
performance: 2
recommended_start_date: 2025-04-12
recommended_player_money: 2000
recommended_enemy_money: 1200
version: "10.9"
settings:
  squadron_start_full: true
  # Ticks the New Game mod boxes for both factions.
  iranmilitaryassetspack: true
  iranairdefensepack: true
  usamilitaryassetspack: true
  f15ex_v3: true
  # Al Dhafra is 383 NM from Kerman.
  max_mission_range_planes: 420
victory:
  description: "Take Kerman. Hold Jask."
  win_when:
