---
name: Caucasus - 1968 Yankee Station
era: vietnam
theater: Caucasus
authors: NoGoodNews (coastal-ladder recast + Niagara/Steel Tiger consolidation by the RetLab)
description: >-
  <p><strong>Note -</strong> A fictional recreation of the 1968 air war over Vietnam,
  played on the Caucasus map. Built for the A-4E, OV-10A and OH-6 mods, Vietnam War
  Vessels, CurrentHill's Russia Asset Pack and High Digit SAMs; New Game ticks them all.
  Original campaign by NoGoodNews, recast by RetLab.</p>
  <p>By the summer of 1968, Rolling Thunder has been running for three years and North
  Vietnam has turned it into a war of attrition. Hanoi sits behind the densest SAM and
  flak belts in the world, the Ho Chi Minh Trail feeds the war in the South every night,
  and at Khe Sanh a Marine garrison is surrounded in the hills below the DMZ.</p>
  <p>The Kolkheti delta plays the Red River. Hanoi is Kutaisi, Haiphong is Kobuleti and
  Kep is Senaki, and the route packages ladder up the coast through Thanh Hoa at Sukhumi,
  Vinh at Gudauta and Dong Hoi at Sochi to the DMZ on the Tuapse coast. South of it, Dong
  Ha holds the line, Da Nang flies from Novorossiysk and Khe Sanh holds the foot of
  Route 9. Two carriers on Yankee Station fly the coastal packages with Crusaders,
  Skyhawks and Intruders, and a battleship works the coast off the DMZ. The Air Force
  crosses the mountains from Ubon and Takhli, at Maykop and Mineralnye Vody, with the Arc
  Light B-52s. The Trail runs from Tuapse over the Shaumyan pass and down the far side of
  the range through Mu Gia and Ban Karai to Tchepone, at the far end of Route 9.</p>
  <p>You will not take Hanoi. Break the North's air force, or cut the Trail at the
  passes, and hold Khe Sanh while you do it. Pump up the volume on "Fortunate Son" and
  enjoy.</p>

recommended_player_faction: USA 1970 Vietnam War
recommended_enemy_faction: Vietnam 1970
recommended_start_date: 1968-06-13
recommended_player_money: 3000
# Economy (2026-07-03 balance pass). This is a static-front WILL campaign, so income mostly
# funds replacements -- and blue's air-to-ground force is uncontested (red flies no fixed-wing
# strikers by design), so a too-rich blue never feels attrition while it craters Regime Resolve
# via trail/ground kills. Two throttles: blue income trimmed 2.0 -> 1.6 (still generous, but
# sustained max-tempo now has a cost), and the enemy given a real war chest (money 1200 -> 1500,
# income 1.1 -> 1.4) so the Ho Chi Minh Trail keeps flowing under interdiction and Regime Resolve
# doesn't collapse before the Rolling Thunder -> Linebacker II arc develops. Blue's starting
# 3000 is a replacement cushion (the fleet starts full via squadron_start_full).
recommended_enemy_money: 1500
recommended_player_income_multiplier: 1.6
recommended_enemy_income_multiplier: 1.4
miz: 1968_Yankee_Station.miz
performance: 2
version: "10.8"
advanced_iads: true

# Operation Niagara: the Route 9 front between Khe Sanh and Tchepone starts pressed in on
# the wire, not at the road's midpoint. The front between two opposing CPs sits at
# strength_pct * route_length from the blue CP, so a depleted Khe Sanh garrison pulls it in.
# Tune 0..1 -- lower = tighter siege.
control_point_strengths:
  FOB Khe Sanh: 0.35

victory:
  description: >-
    You will never take Hanoi -- the front barely moves. Win by breaking the
    North's air arm, or by cutting the trail at the passes.
  win_when:
    - label: "The North's air arm is broken"
      min_turn: 8
      enemy_air_below: 0.30
    - label: "The trail is cut"
      min_turn: 10
      capture_cps: [FOB Mu Gia, FOB Ban Karai, FOB Tchepone]
  lose_when:
    - label: "Khe Sanh falls"
      lose_cps: [FOB Khe Sanh]

settings:
  # Vietnam Ops period mechanics (era pre-seed). Coastal carrier war -> naval gunfire on.
  # Convoy interdiction models the Ho Chi Minh Trail from the Laotian-panhandle FOBs
  # (Mu Gia / Ban Karai / Tchepone); the Super Gaggle runs resupply into the cut-off FOB.
  vietnam_arc_light: true
  vietnam_flak_gauntlet: true
  vietnam_naval_gunfire: true
  vietnam_convoy_interdiction: true
  vietnam_super_gaggle: true
  vietnam_fac_marking: true
  vietnam_snake_and_nape: true
  restrict_weapons_by_date: true
  # Compressed theater: tuck AEW&C/tanker orbits close to the front. The 80/70 NM
  # defaults stand off ~150 km on a small map, sprawling support to the map edge;
  # 25/20 NM holds them ~75-90 km back. Per-campaign, so large maps are untouched.
  # Tunable live on the Air Doctrine settings page.
  aewc_threat_buffer_min_distance: 25
  tanker_threat_buffer_min_distance: 20
  # Red flies a GCI-ambush war (VIETNAM_AIR_DEFENSE_DOCTRINE): hold more MiGs on hot alert
  # for reactive scrambles instead of standing forward BARCAP orbits. 4 QRA airframes per
  # BARCAP-capable OPFOR squadron (was the global default of 2). OWNFOR unchanged.
  opfor_default_qra_reserve: 4
  automate_runway_repair: true
  automate_front_line_reinforcements: true
  automate_aircraft_reinforcements: false
  # Big theater OOB (Navy + USAF over-the-ridge wings + the whole NVAF/trail web): stand
  # the squadrons up at full strength on turn 0 instead of trickling them in via purchases.
  # Each squadron fills to min(size, available parking) at its base. Pre-checks the New
  # Game "Squadrons start full" generator option; applies to both coalitions.
  squadron_start_full: true
  no_enemy_navy: false
  desired_player_mission_duration: 60
  external_views_allowed: true
  max_frontline_width: 30

 #Mods to be used
  a4_skyhawk: true
  a6a_intruder: false
  a7e_corsair2: false
  f4bc_phantom: false
  f15d_baz: false
  f_16_idf: false
  fa_18efg: false
  f22_raptor: false
  f84g_thunderjet: false
  f100_supersabre: false
  f104_starfighter: false
  f105_thunderchief: false
  uh_60l: false
  jas39_gripen: false
  su30_flanker_h: false
  su57_felon: false
  frenchpack: false
  high_digit_sams: true
  ov10a_bronco: true
  swedishmilitaryassetspack: false
  vietnamwarvessels: true
  russianmilitaryassetspack: true
  f111c: false
  oh_6: true
  oh_6_vietnamassetpack: true

# Difficulty settings
# AI Difficulty
  player_skill: "Excellent"
  enemy_skill:  "Average"
  enemy_vehicle_skill: "Average"
  invulnerable_player_pilots: true
  manpads: false
  night_day_missions: NightMissions.OnlyDay

# Mission Restrictions
  labels: "Dot Only"

# Order of battle (2026-09-16 halving: blue 61, red 40). The 2026-11-13 re-lay moved the
# South Vietnam bases up the coast with the DMZ; the airframes are unchanged. The Navy owns
# the coastal route packages from Yankee Station, the Air Force crosses the ridge from the
# Thailand fields, and the in-country wing at Da Nang works the DMZ and Route 9. No SEAD
# squadrons: the Vietnam doctrine drops SEAD from the tasking whitelist (Iron Hand rides the
# strike packages). Red keeps a GCI-ambush MiG force (~26) plus a light Trail/front helo
# presence. Every base fits its parking, so squadron_start_full fields the whole wing.
squadrons:
    # US NAVY -- CV-61 Ranger (Yankee Station): the BARCAP + interdiction + recon deck
    Naval-1:
        - primary: BARCAP
          secondary: air-to-air
          aircraft:
            - F-8E Crusader
          size: 2
        - primary: BAI
          # Steel Tiger tilt: Ranger's Skyhawks fly armed recon / BAI on the Trail convoys.
          secondary: air-to-ground
          aircraft:
            - A-4E Skyhawk
          size: 2
        - primary: TARPS
          # Unarmed photo bird, TARPS only -- no secondary (the old air-to-ground
          # alias is what put recon birds on Armed Recon/Strike, G19).
          aircraft:
            - RA-5C Vigilante
          size: 1

    # US NAVY -- CVAN-65 Enterprise (Yankee Station): the strike deck. It carries the one
    # E-2 and the one tanker for both decks, a few miles apart on station.
    Naval-2:
        - primary: AEW&C
          aircraft:
            - VAW-123 #Screwtops - E-2 Hawkeye
          size: 2
        - primary: Refueling
          aircraft:
            - A-6E Tanker
          size: 2
        - primary: BARCAP
          secondary: air-to-air
          aircraft:
            - F-8E Crusader
          size: 2
        - primary: Strike
          secondary: air-to-ground
          aircraft:
            - A-6E Intruder
          size: 4
        - primary: BAI
          secondary: air-to-ground
          aircraft:
            - A-6E Intruder
          size: 2
        - primary: CAS
          secondary: air-to-ground
          aircraft:
            - A-4E Skyhawk
          size: 2

    # Da Nang (Novorossiysk): the in-country wing, ~40 NM behind the DMZ
    Novorossiysk:
        - primary: BARCAP
          secondary: air-to-air
          aircraft:
            - F-4E-45MC Phantom II
          size: 2
        - primary: CAS
          secondary: air-to-ground
          aircraft:
            - A-1H Skyraider
          size: 2
        - primary: BAI
          # Steel Tiger tilt: Skyraiders working the Trail by day.
          secondary: air-to-ground
          aircraft:
            - A-1H Skyraider
          size: 2
        - primary: CAS
          secondary: air-to-ground
          aircraft:
            - OV-10A Bronco
          size: 2
        - primary: TARPS
          # Unarmed photo bird, TARPS only -- no secondary (see RA-5C note).
          aircraft:
            - RF-101B Voodoo
          size: 1
        - primary: Transport
          # The Combat SAR "King" C-130 (player-flown).
          secondary: any
          aircraft:
            - C-130J-30
          size: 1

    # Phu Bai / Chu Lai (Gelendzhik): the Marine helo field nearest Khe Sanh, where the
    # Super Gaggle launches.
    Gelendzhik:
        - primary: Air Assault
          secondary: any
          aircraft:
            - UH-1H Iroquois
          size: 2

    # FOB Khe Sanh: the besieged hill outpost on Route 9 (Super Gaggle destination).
    # Sized to its 6 helipads.
    FOB Khe Sanh:
        - primary: CAS
          secondary: air-to-ground
          aircraft:
            - AH-1W SuperCobra
          size: 2
        - primary: Air Assault
          secondary: any
          aircraft:
            - UH-1H Iroquois
          size: 2
        - primary: Transport
          secondary: any
          aircraft:
            - UH-1H Iroquois
          size: 2

    # Cam Ranh Bay (Krymsk): the rear -- College Eye, gas and lift.
    Krymsk:
        - primary: AEW&C
          # College Eye: the land-based EC-121 radar picture alongside the carriers' E-2s.
          aircraft:
            - EC-121D Warning Star
          size: 1
        - primary: Refueling
          aircraft:
            - KC-135 Stratotanker
          size: 1
        - primary: Transport
          secondary: any
          aircraft:
            - CH-47D
          size: 2

    # Ubon RTAFB (Maykop): Phantoms over the ridge + the Arc Light B-52 cell (the 307th
    # Strategic Wing of U-Tapao, folded in here).
    Maykop-Khanskaya:
        - primary: Escort
          secondary: air-to-air
          aircraft:
            - F-4E-45MC Phantom II
          size: 4
        - primary: Strike
          secondary: air-to-ground
          aircraft:
            - F-4E-45MC Phantom II
          size: 2
        - primary: Strike
          aircraft:
            - 307th Strategic Wing #B-52H Stratofortress (U-Tapao)
          size: 4

    # Takhli RTAFB (Mineralnye Vody): the Thud run into RP VI from the NW.
    Mineralnye Vody:
        - primary: Strike
          secondary: air-to-ground
          aircraft:
            - F-100D Super Sabre
          size: 4
        - primary: Escort
          secondary: air-to-air
          aircraft:
            - F-4E-45MC Phantom II
          size: 2
        - primary: BAI
          secondary: air-to-ground
          aircraft:
            - F-100D Super Sabre
          size: 2
        - primary: Refueling
          # Organic gas for the Takhli strike run.
          aircraft:
            - KC-135 Stratotanker
          size: 1

    # --- North Vietnam (GCI-ambush air arm: ~26 MiGs, defensive MiGCAP only) ---

    # Hanoi (Kutaisi): the MiG hub inside the SA-2 ring
    Kutaisi:
        - primary: BARCAP
          aircraft:
            - MiG-21bis Fishbed-N
          size: 6
        - primary: BARCAP
          aircraft:
            - MiG-17F Fresco-C
          size: 6
        - primary: Transport
          aircraft:
            - Mi-8MTV2 Hip
          size: 2

    # Kep (Senaki-Kolkhi): the MiG-17 field NE of Hanoi. DEFENSIVE (MiGCAP): Hanoi flew a
    # pure GCI-ambush war (VIETNAM_AIR_DEFENSE_DOCTRINE); a BAI/air-to-ground primary
    # auto-assigns MiGs to offense. BARCAP + air-to-air keeps them intercepting and lets
    # their QRA reserve scramble.
    Senaki-Kolkhi:
        - primary: BARCAP
          secondary: air-to-air
          aircraft:
            - MiG-17F Fresco-C
          size: 6

    # Haiphong (Kobuleti): the port, its POL farm and SA-2 ring.
    Kobuleti:
        - primary: Transport
          aircraft:
            - An-26B
          size: 2

    # Thanh Hoa (Sukhumi-Babushara): panhandle staging. MiG-17Fs defensive (MiGCAP).
    Sukhumi-Babushara:
        - primary: BARCAP
          secondary: air-to-air
          aircraft:
            - MiG-17F Fresco-C
          size: 4

    # Vinh (Gudauta): the staging field for the DMZ -- no MiGs this far south
    Gudauta:
        - primary: CAS
          secondary: air-to-ground
          aircraft:
            - Mi-8MTV2 Hip
          size: 2
        - primary: Air Assault
          secondary: any
          aircraft:
            - Mi-8MTV2 Hip
          size: 2

    # "Chinese border" fields (Tbilisi-Lochini): the sanctuary the ROE never releases.
    Tbilisi-Lochini:
        - primary: BARCAP
          aircraft:
            - MiG-21bis Fishbed-N
          size: 4

    # The Trail (north slope of the range): Tchepone feeds the Route 9 siege.
    FOB Tchepone:
        - primary: CAS
          secondary: air-to-ground
          aircraft:
            - Mi-8MTV2 Hip
          size: 2
        - primary: Transport
          secondary: any
          aircraft:
            - Mi-8MTV2 Hip
          size: 2

    FOB Mu Gia:
        - primary: Transport
          secondary: any
          aircraft:
            - Mi-8MTV2 Hip
          size: 2

# The Yankee Station decks: Ranger on a Forrestal-class hull, Enterprise as she sailed in 1968.
carriers:
  Naval-1:
    preferred_name: CV-61 USS Ranger
    preferred_type: CV-59 Forrestal
  Naval-2:
    preferred_name: CVAN-65 USS Enterprise
    preferred_type: "[VWV] CVAN-65 USS Enterprise '66"

# The naval gunfire gun line off the DMZ: a battleship and a destroyer inside 10 NM of the coast.
ground_forces:
  Gun Line: Vietnam Gun Line

red_tempo:
  - from_turn: 1
    name: Rolling Thunder
    trail_surge: 1.5
  - from_turn: 8
    name: The Bombing Halt
    trail_surge: 2.0
  - from_turn: 11
    name: Linebacker
    ground_offensive: 3
