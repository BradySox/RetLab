name: Iraq - Desert Aladeen - The H-3 Front
theater: Iraq
authors: Starfire, RetLab
recommended_player_faction: USA 2012
recommended_enemy_faction: Republic of Wadiya 1991
description: >-
  <p><strong>Note -</strong> Starfire's Operation Desert Aladeen, reversed and fought
  east from H-3. The original still ships unchanged. Every unit is stock DCS.</p>
  <p>Admiral-General Haffaz Aladeen did not wait for the United Nations vote. While the
  coalition was still arguing over the wording, Wadiyan armor rolled south and took
  Baghdad, Al-Salam and every airfield from Mosul to Al-Kut, and his navy ran a flag up
  over Kharg Island because it looked nice on the map.</p>
  <p>The coalition holds three desert strips at H-3 on the Jordanian border, with its
  AWACS, tankers and bombers flying in from the Jordanian rear. Out in the north-west,
  Aladeen has hidden his Scuds, his SA-10s and a superphosphate works that is definitely
  not refining uranium.</p>
  <p>Push east up the old pipeline road. Take FOB Wadi Hauran, then Al-Asad, then the
  Habbaniyah line, and keep going until every airfield from Baghdad to Mosul, Erbil and
  Sulaimaniyah is free. Kharg Island does not count. Lose H-3 Main, and Aladeen wins.
  Aladeen luck, Commander.</p>
miz: desert_aladeen_h3_front.miz
performance: 2
recommended_start_date: 2012-05-16
version: "10.9"
settings:
  squadron_start_full: true
# Kharg has no road or sea link, so no front ever reaches it, and the stock win needs
# every red base taken. This win names the Iraqi bases and leaves Kharg out.
victory:
  description: >-
    Free Iraq. Take FOB Wadi Hauran and every Iraqi airfield Aladeen holds, from
    Al-Asad to Baghdad and north to Mosul, Erbil and Sulaimaniyah. Kharg Island
    does not count. Lose H-3 Main and the war is lost.
  win_when:
    - label: "Iraq is free"
      capture_cps:
        - FOB Wadi Hauran
        - Al-Asad Airbase
        - Al-Taquddum Airport
        - Baghdad International Airport
        - Al-Salam Airbase
        - Al-Kut Airport
        - Al-Sahra Airport
        - Kirkuk International Airport
        - Sulaimaniyah International Airport
        - Qayyarah Airfield West
        - Erbil International Airport
        - Mosul International Airport
  lose_when:
    - label: "H-3 Main falls"
      lose_cps: [H-3 Main Airbase]
