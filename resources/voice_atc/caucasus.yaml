# Visual arrival and departure routes read from the DCS Caucasus kneeboard charts
# (<DCS>/Mods/terrains/Caucasus/Kneeboard/NN_VAD_*.png, rev 3.5.0, 2012), keyed by DCS
# airport name. Facts only: point names, positions, runways and altitudes. Runways are the
# chart's numbers; DCS numbers some ends 10 to 30 degrees off, matched by heading.
# entry: runways an inbound flight may enter for here ([] = exit only); exit: departures leave here.
