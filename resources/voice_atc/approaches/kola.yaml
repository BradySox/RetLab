# ILS, TACAN and LOC approaches read from the DCS Kola kneeboard plates
# (<DCS>/Mods/terrains/Kola/Kneeboard/*.png), keyed by DCS airport name. Facts only.
# start: the fix Approach clears the flight via (the plate's IF, else its IAF); null name =
# an unnamed DME fix. final: the final approach fix, where the flight goes to Tower.
# Altitudes are feet MSL; dme is the plate's DME at the fix.
