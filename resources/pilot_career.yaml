# Rank ladders for the pilot logbook (RetLab feature 96).
#
# Data, not code. Retribution spans many air forces and seventy years, so a rank
# ladder hard-coded to one service would be wrong for most campaigns. Add a
# ladder here rather than in Python; a squadron picks the first ladder listing
# its DCS country, and the ladder with no `countries:` is the fallback.
# Grade names are abbreviated on every ladder, without periods.
#
# `requires:` is a plain "field must be at least this" map over the pilot's
# career record: sorties, combat_sorties, flight_hours, shots, hits, air_kills,
# ground_kills, naval_kills, kills, ejections, missions_flown. An entry naming a
# field that does not exist is skipped and logged -- it never blocks the app.
#
# Ranks are RECORDS, not rewards. Nothing here unlocks an aircraft,
# changes availability or gates a mission; that is the whole point of the
# feature. See docs/dev/retlab-features.md section 96.

version: 1

ranks:
  - ladder: commonwealth
    countries:
      - UK
      - Australia
      - Canada
      - New Zealand
      - India
      - Pakistan
    grades:
      - key: cw_1
        name: Plt Off
        requires: {}
      - key: cw_2
        name: Fg Off
        requires: {combat_sorties: 5}
      - key: cw_3
        name: Flt Lt
        requires: {combat_sorties: 15}
      - key: cw_4
        name: Sqn Ldr
        requires: {combat_sorties: 35, flight_hours: 40}
      - key: cw_5
        name: Wg Cdr
        requires: {combat_sorties: 70, flight_hours: 90}

  - ladder: soviet
    countries:
      - Russia
      - USSR
      - Ukraine
      - Belarus
      - Kazakhstan
      - Georgia
    grades:
      - key: sv_1
        name: Lt
        requires: {}
      - key: sv_2
        name: Sr Lt
        requires: {combat_sorties: 5}
      - key: sv_3
        name: Capt
        requires: {combat_sorties: 15}
      - key: sv_4
        name: Maj
        requires: {combat_sorties: 35, flight_hours: 40}
      - key: sv_5
        name: Lt Col
        requires: {combat_sorties: 70, flight_hours: 90}

  # No `countries:`, so this is the fallback for every other air force.
  - ladder: default
    grades:
      - key: of_1
        name: 2nd Lt
        requires: {}
      - key: of_2
        name: 1st Lt
        requires: {combat_sorties: 5}
      - key: of_3
        name: Capt
        requires: {combat_sorties: 15}
      - key: of_4
        name: Maj
        requires: {combat_sorties: 35, flight_hours: 40}
      - key: of_5
        name: Lt Col
        requires: {combat_sorties: 70, flight_hours: 90}
