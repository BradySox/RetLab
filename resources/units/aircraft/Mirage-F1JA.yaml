description:
  The Mirage F1JA is the Mirage F1 version built for Ecuador, delivered from 1978 and
  retired in 2011. Ecuadorian F1JAs shot down Peruvian Su-22s in the 1995 Cenepa War.
  In DCS it is an AI-only aircraft.
