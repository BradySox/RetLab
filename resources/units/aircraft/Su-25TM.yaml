always_keeps_gun: true
description:
  The Su-25TM (also offered for export as the Su-39) is a further development of the
  Su-25T anti-tank aircraft, adding the Kopyo radar pod for anti-ship and air-to-air
  missiles. Only a handful were built and flown by the Russian Air Force for trials;
  it never entered squadron service. In DCS it is an AI-only aircraft.
