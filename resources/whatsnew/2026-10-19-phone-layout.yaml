date: 2026-10-19
title: Flights and kneeboards on your phone
change: >-
  The phone map now fits a phone. Three tabs along the bottom: the map, your
  flights grouped by package with their TOT, and the last generated mission's
  briefing picture and kneeboard pages. Tap a flight to see its route. Use
  your browser's Add to Home Screen to open it like an app.
watch: >-
  After Take Off, the Kneeboards tab shows this mission's pages and no
  leftovers from an earlier mission.
