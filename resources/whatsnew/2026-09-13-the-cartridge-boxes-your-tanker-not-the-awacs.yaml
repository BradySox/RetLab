date: 2026-09-13
title: The cartridge boxes your tanker, not the AWACS
change: >-
  The Hornet's SA page draws only one of the cartridge's FAOR lines, and it
  was the AWACS box. The boxes are now the tankers your jet can actually
  refuel from -- probe or boom -- nearest to your target first, on the
  Hornet, Viper, F-14B(U) and Apache alike. The AWACS orbit is still a
  point; it just has no box.
watch: >-
  Slot into a Hornet and look at the SA page: the one box should sit
  around the tanker briefed for you. A Viper with a probe-only tanker on
  the ATO should draw no box for it.
row: B115
