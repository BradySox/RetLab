date: 2026-10-12
title: HQ requests
change: >-
  Each turn HQ asks you to take out up to three enemy targets the
  auto-planner left alone: one easy, one mid and one hard to reach. Each
  stays open for 2 to 5 turns. There is no prize; the SITREP notes the ones
  you destroy. On for new games (Doctrine settings, HQ requests); older saves
  keep it off.
watch: >-
  The HQ REQUESTS chip on the map's status bar lists them, each is ringed in
  gold on the map, and a flight sent against one has an HQ REQUEST line on
  its kneeboard. Tell us if a request names a target a package already has.
