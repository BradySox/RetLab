date: 2026-11-26
title: New Germany and Kola airfields
change: >-
  The 20 new Cold War Germany airfields and Kola's 3 new airports from the
  DCS 2.9.32 update can now be used by campaigns. The A-6E Anti-ship fit now
  carries 2 Walleye II and the AWW-13 datalink pod.
watch: >-
  On Baltic Fury, the heavy bombers at Szczecin-Goleniow should start on
  their stands. An AI A-6E Anti-ship flight should drop its Walleyes on a ship.
