date: 2026-11-16
title: Fuel plan you can trust
change: >-
  The fuel line under the slider now says what you land with if you never
  meet a tanker, and says "needs the tanker" or "short" in plain words. It
  counts start-up, taxi and the hold. The F-4E burns at rates measured from
  about 50 flown sorties; the old numbers showed about half the real burn.
watch: >-
  F-4E kneeboard fuel ladders and bingo numbers come out higher than before.
  A tanker pass on the route that the sortie does not need reads "Tanker: not
  needed".
