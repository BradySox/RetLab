date: 2026-10-24
title: More stock DCS jets in the factions
change: >-
  Five AI jets that ship with DCS can now be flown by the AI: the
  F/A-18A (USN 1985, Desert Storm, Canada, Australia, Spain 1990), the
  Su-25TM (Russia and generic redfor 2010 on), the Mirage F1CR (France)
  and the Mirage F1JA and F1AZ (Bluefor Cold War). Red's transport fleets
  in the Soviet, Russian and Syrian factions gain the Yak-40, and USA 1975,
  Final Countdown II and Bluefor Cold War gain the early F-14A.
watch: >-
  An existing campaign keeps its old air wing. Start a new game to get
  the new jets.
