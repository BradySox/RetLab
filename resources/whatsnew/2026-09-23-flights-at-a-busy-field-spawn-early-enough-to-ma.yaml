date: 2026-09-23
title: Flights at a busy field spawn early enough to make their takeoff
change: >-
  Every flight used to get 8 minutes to taxi, however many others left the
  same field at once. Flights now queue for the runway at 45 seconds per
  jet, and a flight spawns earlier by its wait. A quiet field keeps 8
  minutes. When a flight needs to start before the turn's clock, the
  mission starts up to 30 minutes early; TOTs do not move.
watch: >-
  At a field with many departures bunched together, the later flights
  should now be airborne close to their planned takeoff instead of up to
  15 minutes late. No group should spawn at 0:00 and fly late.
row: B145
