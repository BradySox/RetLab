date: 2026-10-24
title: Flights park side by side
change: >-
  Each flight's jets park on neighbouring stands, with the lead on the
  stand nearest the runway end it departs from. A flight no longer
  splits across the ramp, so its wingmen fall in behind the lead
  instead of meeting it nose to nose on the taxiway.
watch: >-
  A flight frozen on the taxiway, or a wingman taxiing toward its lead
  against the flow.
