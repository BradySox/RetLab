date: 2026-11-16
title: Goggles on night flights
change: >-
  A flight that takes off or lands in the dark gets night-vision goggles
  where the jet carries them on top of its helmet sight: the A-10C II gets
  HMCS + NVG, and the Harrier, Strike Eagle and Mirage 2000C get goggles
  mounted. The F-16C and F/A-18C keep JHMCS; pick NVG in the payload tab if
  you want it. A choice you already made for the jet is kept.
watch: >-
  Check the goggles on your first dusk or night slot.
