date: 2026-09-11
title: The A-10 and the Apache fly Sandy again
change: >-
  A rescue escort is a mission type again. Create a package on a downed
  pilot, add a flight, and pick Sandy: the A-10 and the Apache offer it and
  nothing else does. The flight gets a short armed track centred on the
  survivor instead of one along the front line, and defaults to the Sandy
  callsign. Frag it by hand — the auto-planner never adds one.
watch: >-
  With a survivor on the map, check Sandy is in the mission-type list for an
  A-10 or an Apache and for no other airframe. The track should sit on the
  pilot, not on the FLOT, and an Apache should fly it low. Pass a turn and
  confirm no Sandy turned up in the auto-planned ATO.
row: B117
