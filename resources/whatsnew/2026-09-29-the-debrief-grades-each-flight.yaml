date: 2026-09-29
title: The debrief grades each flight
change: >-
  After a mission, the debrief has a Flight report cards box: one card per
  blue flight that flew, yours first. Each card grades timing at the
  target, the package target, kills, shots and hits, losses and your fuel
  on landing against the jet's reserve,
  from Unsat to Above average, and lists the faults.
watch: >-
  Note when you were over the target and what you hit. Your card's timing
  and counts should match within about a minute.
row: B158
