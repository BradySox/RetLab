date: 2026-11-17
title: Move SAM batteries
change: >-
  A friendly SAM or radar site's window has a Move button. The whole site
  packs up and drives to the point you type. While packed it is off the
  IADS, shows no threat ring, and holds fire; where it stops it sets up
  again and rejoins the network. An enemy battery that moves is unknown on
  your map again until it is hit.
watch: >-
  Towed launchers need trucks in the site. Self-propelled batteries such as
  the SA-6, SA-11 and SA-15 move as they are.
