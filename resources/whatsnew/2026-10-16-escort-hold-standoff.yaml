date: 2026-10-16
title: Escorts hold where stand-off shooters launch
change: >-
  When every attacker in a package carries a long-range weapon, such as a
  Harpoon or a Kh-59M, the attackers start their run far from the target.
  Their escorts now hold at that range too. Before, the escort hold sat 7 to 9
  NM from the target, deep inside its defenses. A package with any bomber or
  short-range attacker keeps the old hold.
watch: >-
  Open the escort of a package whose attackers all carry Harpoons or SLAM-ERs.
  Its Escort Hold point sits out at the package's ingress, not next to the
  target.
