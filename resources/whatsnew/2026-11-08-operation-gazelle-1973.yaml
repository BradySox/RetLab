date: 2026-11-08
title: Operation Gazelle fits 1973
change: >-
  Sinai - Operation Gazelle now matches the Yom Kippur War. Israel flies the
  A-4E Skyhawk from Hatzor again and has no AWACS. Egypt loses its SA-5 and
  gains T-62 tanks, AT-3 Sagger teams, BTR-60s, KS-19 guns and a Scud site
  east of Cairo. Fayed, Kibrit and Abu Suwayr on the canal are new Egyptian
  airbases with SAM cover. Kedem is now Israeli. Two AAA guns were moved off
  the Tel Nof and Hatzor runways. New Game ticks the community A-4E mod;
  the Skyhawks need it installed. Start a new game to see it.
watch: >-
  On a new Operation Gazelle game, the A-4E squadrons are at Hatzor, AI jets
  taxi and take off normally at Tel Nof and Hatzor, and the Scud site east
  of Cairo sits on level ground with its launchers upright.
