date: 2026-09-09
title: A border country's defences scale with the country
change: >-
  A neutral country used to stand one missile battery however big it was --
  on the Afghanistan map that was a single S-300 covering 3.5 % of
  Pakistan's border, and crossing anywhere else met nothing. It now stands
  one battery per 200 nautical miles of the border the war is actually near,
  up to six, spread along that frontier. Press one and the whole country
  turns hostile, not just the site you flew past. Turkmenistan, Uzbekistan,
  Tajikistan, Armenia and Azerbaijan are drawn and defended now; they were
  being left off the map because DCS has no country for them.
watch: >-
  Look at a large neighbour on the F10 map before you cross. Pakistan should
  show five or six batteries on the Afghan side and none down by the Indian
  border. If it reads like an air-defence network rather than a border, say
  so.
row: B120
