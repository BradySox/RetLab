date: 2026-08-20
title: Steerpoint elevations stop reading as cruise altitude
change: >-
  The Hornet and Viper cartridges carry two altitudes per steerpoint — the
  ground under it, and the height you fly the leg at — and we were writing
  the same number into both. An en-route point told the jet the ground under
  it was at 18,000 ft. Landing points now carry their field's elevation, and
  the route altitude is unchanged.
watch: >-
  On a regenerated mission, check an en-route steerpoint's elevation on the
  DED or the HSI: ground level, not your cruise altitude. A target steerpoint
  still reads zero — that half is not fixed.
row: B90
