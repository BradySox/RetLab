date: 2026-11-16
title: Convoys keep their place on long roads
change: >-
  A supply convoy now drives 120 miles a turn along its road (60 off-road)
  and picks up where it stopped. A short road still takes one turn; a long
  one takes two or three, and the column spawns on the road where it is,
  so it can be found and hit on the way. Campaign setting: Ground movement,
  on for new games.
watch: >-
  The Pending transfers list shows the miles left for a convoy on the road.
