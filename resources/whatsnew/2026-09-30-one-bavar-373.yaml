date: 2026-09-30
title: One Bavar-373, firing the Sayyad-4B
change: >-
  The Bavar-373 comes in one version: the original launcher, firing the
  Sayyad-4B. The Sayyad-4, the Sayyad-4B launcher and the Bavar-373-II are
  gone, because a Sayyad-4 site never fired. A saved campaign's Bavar sites
  load with the one launcher.
watch: >-
  A Bavar-373 site should raise its launchers and fire Sayyad-4Bs at a jet
  inside 86 NM.
row: B148
