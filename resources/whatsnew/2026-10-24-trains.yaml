date: 2026-10-24
title: Trains on the rail lines
change: >-
  Fulda Gap 1985 has four rail lines. Supply between two bases on a rail
  line goes by train, on both sides. A destroyed train loses everything
  it carried. Trains show on the map as supply routes and can be hit with
  BAI and Armed Recon.
watch: >-
  A train that does not move from its first station, or that dies with
  its cargo still arriving next turn.
