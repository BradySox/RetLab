date: 2026-10-21
title: The map leaves the video card to DCS
change: >-
  The campaign map now draws without the video card. Retribution held up to
  4 GB of video memory next to DCS; that memory now goes to DCS and the
  voice bots. The "map is paused" note during missions is gone: the map
  stays up the whole time.
watch: >-
  Panning and zooming the map should still feel smooth. If it stutters on
  a big campaign, say so.
