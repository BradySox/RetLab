date: 2026-10-10
title: New campaign, Kola - Northern Flank 1985
change: >-
  A 1985 campaign on the Kola map. The Soviets hold Kirkenes, Banak and
  Alta and push down the coast road toward Bardufoss, 115 NM away. Their
  fleet and supply ships are at sea and Backfires hunt your carrier.
  Sweden and Finland are neutral, with live SAMs on their borders. You
  fly Tomcats, Intruders and Hornets off the boat, and Vipers, Hornets,
  F-4Es, F-15s, F-5s, A-10s and Apaches from four Norwegian fields.
  Stock DCS units only, weapons held to 1985.
watch: >-
  New Game, pick Kola - Northern Flank 1985. Check Sweden and Finland
  draw as neutral, the front sits near Skibotn, and Soviet cargo ships
  are sailing from Murmansk to Kirkenes and round to Banak.
