date: 2026-10-19
title: New campaign - Red Bear 1985
change: >-
  A fictional winter war across the top of the Afghanistan map in January
  1985. A USAF wing of F-4E Phantoms holds Herat and Shindand, and its
  B-52s, tankers and E-3A fly from Camp Bastion, far behind the fighting. The Soviet 40th Army holds the north and
  Kabul. Fight up the ring road through Maymana and Mazar-i-Sharif to the
  Salang, and over the mountains through Chaghcharan and Bamyan. The Soviet
  air defense is a network: its comms towers, power plants and two HQs are
  targets. Take Bagram and Kabul to win; lose Herat and you lose. Stock DCS only.
watch: >-
  Two front lines run out of Herat, and none opens at Camp Bastion.
