date: 2026-11-22
title: Red raids come in waves
change: >-
  Red's strike, CAS, SEAD, DEAD, anti-ship and airfield attack packages are
  now grouped into 2 or 3 raids, spread from the earliest red can arrive to
  just before your mission ends. SEAD and DEAD go first in each raid. Blue's
  timing is unchanged.
watch: >-
  Open red's packages on the map: their times should fall into 2 or 3
  groups a few minutes wide, not all just after their earliest arrival.
