date: 2026-11-07
title: Real squadrons for stock DCS paint jobs
change: >-
  About 220 new squadrons use liveries that ship with DCS, so more of your air
  wing flies real unit names and markings instead of default paint. The F-100D,
  P-51D, Corsair, early F-14A, JF-17 and J-11A had no squadrons before. Squadrons
  with several stock tail-number skins, such as the F-15E 492nd and 336th, now
  rotate through all of them.
watch: >-
  Check that a new squadron's jets wear its paint in the mission, not the default.
