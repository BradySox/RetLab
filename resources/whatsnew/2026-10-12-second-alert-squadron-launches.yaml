date: 2026-10-12
title: A base's second alert squadron joins the fight
change: >-
  When a base held two alert (QRA) squadrons, only the first ever
  scrambled. Once its jets were gone the base stopped launching, with the
  second squadron still parked. The second now launches when the first has
  no jets left.
watch: >-
  At an enemy base with two alert squadrons (the base card lists both),
  shoot down everything the first one sends. The next scramble comes from
  the other squadron's aircraft type.
