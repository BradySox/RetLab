date: 2026-10-24
title: Country borders on the Germany map
change: >-
  The Germany Cold War map now has country borders. A campaign set before
  October 1990 shows East and West Germany as two countries; a later one
  shows one Germany. The lines appear on kneeboard maps and cockpit data
  cards, and neutral border defense uses them when it is on.
watch: >-
  On a Fulda Gap 1985 kneeboard map, a line runs along the inner German
  border; on a 2027 campaign it does not.
