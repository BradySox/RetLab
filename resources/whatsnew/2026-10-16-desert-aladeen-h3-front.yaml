date: 2026-10-16
title: New campaign - Desert Aladeen, The H-3 Front
change: >-
  Starfire's Desert Aladeen with the map turned around. Red now holds
  Baghdad, Al-Salam and every field from Mosul to Al-Kut, plus Kharg. Blue
  holds the three H-3 strips on the Jordanian border, with its AWACS,
  tankers, B-1Bs and C-130Js flying from an off-map rear in Jordan. The
  front starts at FOB Wadi Hauran, about 85 miles east of H-3, then climbs
  through Al-Asad and Al-Taquddum to Baghdad. North-west Iraq has 10 strike
  targets, 6 Scud sites and 6 SAM sites. Both factions are new and use stock
  DCS units only: USA 2012, and Republic of Wadiya 1991 with early-90s jets,
  no AWACS or tankers, and SA-10, SA-11, SA-5, Tor and Tunguska SAMs.
watch: >-
  Blue jets spawn on the H-3 ramps, and the front line runs from H-3 Main
  to FOB Wadi Hauran.
