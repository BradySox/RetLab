date: 2026-10-21
title: Every frequency preset, and a comm card
change: >-
  Your jet's radios now come preset like a squadron comm card. COMM1 holds
  the SkyEye AWACS, Vacuum, STRIKE, JTAC and the tankers; COMM2 holds your
  flight on channel 1, then Ground and Tower. With an ABCCC running, STRIKE is
  your package frequency, so you never dial it. A new Comm Card page on the
  kneeboard lists every preset on both radios by name.
watch: >-
  An F-16's COM2 is VHF only, so its Ground and Tower stay on COM1.
