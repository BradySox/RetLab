date: 2026-10-17
title: New campaign - Mount Pleasant 2032
change: >-
  A defensive Falklands war in November 2032. Argentina has landed at Goose
  Green and San Carlos with HQ-7 batteries. The UK garrison holds Mount
  Pleasant and Stanley with Sky Sabre and a Type 45, and a US Air Force
  detachment of F-16s and F-15Es fights beside it, with the AWACS and
  tankers flying in from Ascension. Clear Goose Green and San Carlos to win;
  lose Mount Pleasant and you lose. Pick Invert Sides at New Game to play the
  landing. Tick the CurrentHill UK pack and the community A-4E mod.
watch: >-
  Two front lines form, Mount Pleasant to Goose Green and Stanley to San
  Carlos, and Sky Sabre stands at Mount Pleasant.
