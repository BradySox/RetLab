date: 2026-11-08
title: New campaign - Black Sea Coast 1985
change: >-
  A late Cold War war on the Caucasus map. In May 1985 Georgia has broken
  from Moscow and NATO holds Senaki, Kutaisi and the Tbilisi fields, with a
  Forrestal-class carrier in the Black Sea. Blue drives up the coast road
  through Sukhumi, Gudauta and Sochi to Tuapse, then over the hills to
  Krasnodar, with Maykop and Krymsk on the flanks. USAF F-4Es fly from
  Senaki, F-14As and A-6Es from the carrier. The Soviets fly MiG-21s,
  MiG-23s, MiG-25s and one regiment of MiG-29s, with Backfires at Krymsk,
  and an SA-2, SA-3, SA-6 and SA-11 belt guards the coast. Take both
  Krasnodar fields to win; lose Senaki and you lose. Every unit is stock DCS.
watch: >-
  One front line forms, Senaki to Gali, and no SA-5 or SA-10 appears.
