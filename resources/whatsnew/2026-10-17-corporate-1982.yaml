date: 2026-10-17
title: New campaign - Operation Corporate 1982
change: >-
  The Falklands War from 21 May 1982. The commandos are ashore at San
  Carlos, HMS Hermes and HMS Invincible stand off to the east, and Argentina
  holds Stanley, Goose Green and Mount Kent. Argentine Skyhawks and Mirages
  fly 350 to 430 NM from the mainland, and the Navy's Skyhawks fly off the
  Veinticinco de Mayo. Take Stanley to win; lose San Carlos and you lose.
  Pick Invert Sides at New Game to play Argentina. Tick the community A-4E
  mod, or Argentina loses its Skyhawks.
watch: >-
  Two front lines run out of San Carlos, and the Harriers fly CAP over the
  fleet with Sidewinders.
