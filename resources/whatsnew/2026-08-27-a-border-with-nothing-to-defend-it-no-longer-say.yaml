date: 2026-08-27
title: A border with nothing to defend it no longer says it will
change: >-
  A country only defends its airspace if it can actually put a fighter up,
  and some cannot -- DCS models no Turkmenistan at all, and Cyprus, Armenia,
  Azerbaijan and Argentina have no aircraft on record for the era. The
  mission always knew that and let you fly through them. The planning map
  did not, and drew them closed, so on a Caucasus campaign you would route
  the long way around Armenia for nothing. The map now agrees with the
  mission: 14 countries across six maps that read closed are drawn as
  passable, because that is what they are.
watch: >-
  Hover Armenia or Azerbaijan on a Caucasus campaign, or Cyprus on a Syria
  one. They should read as overflight permitted, not "closed to you at any
  altitude". Any country still drawn closed should be one that really does
  come up after you.
row: B120
