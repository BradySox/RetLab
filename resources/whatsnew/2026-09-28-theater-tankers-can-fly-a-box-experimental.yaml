date: 2026-09-28
title: Theater tankers can fly a box (experimental)
change: >-
  A theater tanker flight's Payload tab has Fly a box (experimental): the
  tanker flies a 40 x 20 NM box instead of a two-point racetrack, looping
  it until its time on station is up. Save as default keeps it for that
  airframe. The front leg is where the racetrack would be. Drag any of its points on the
  map to move the whole box. Package and recovery tankers keep the
  racetrack.
watch: >-
  The tanker flies all four corners, goes round more than once, keeps
  refueling through the corners, and leaves for home when its time is up.
row: B153
