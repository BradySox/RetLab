date: 2026-10-18
title: Israeli helicopters at Tel Nof
change: >-
  Anatolian Reach's Tel Nof now has the 113th Squadron's Apaches and the
  124th Squadron's Black Hawks (UH-60L mod), both in IAF paint. Helicopters
  can't reach Turkey from Israel, so they wait until a forward base falls.
  New games only.
watch: >-
  A new Anatolian Reach game lists both squadrons at Tel Nof in IAF paint.
