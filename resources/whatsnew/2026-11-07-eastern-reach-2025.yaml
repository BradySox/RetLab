date: 2026-11-07
title: New campaign - Eastern Reach 2025
change: >-
  A long-range war at the east end of the Persian Gulf map. US Marines hold
  Bandar-e-Jask and drive north up the highway through Sirik, Minab, Kahnuj,
  Jiroft and the Jebal Barez pass to Kerman, where Iran keeps its missile
  works and most of its Tomcats and Fulcrums behind Bavar-373 batteries.
  Strikes on Kerman fly 300 NM or more from the UAE fields, so every one
  needs a tanker. A carrier and an LHA sit in the Gulf of Oman. Take Kerman
  to win; lose Jask and you lose. New Game ticks the CurrentHill Iran and USA
  packs, the RetLab Iran Air Defense Pack and the F-15EX V3 mod for you.
watch: >-
  One front line forms, Jask to Sirik, and Bandar Abbas stays empty.
