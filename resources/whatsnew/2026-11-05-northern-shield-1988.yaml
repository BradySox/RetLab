date: 2026-11-05
title: New campaign - Northern Shield 1988
change: >-
  Red Tide's war on the northern edge of the Germany Cold War map. NATO
  holds Copenhagen, Bornholm and Sturup in Sweden, across the Baltic from
  the East German coast. There is no land front at the start: clear the
  garrison at Barth and take it by air assault, then push south through
  Neubrandenburg to Templin past the real SA-2, SA-3 and SA-5 sites.
  Lose Copenhagen and you lose. Stock DCS only.
watch: >-
  No front line until Barth falls. Its garrison stands on the field.
