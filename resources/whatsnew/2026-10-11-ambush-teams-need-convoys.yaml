date: 2026-10-11
title: No enemy ambush teams behind your lines when land convoys are off
change: >-
  With Disable land convoys ticked, the hidden convoy ambush teams are no
  longer placed. They used to appear on the roads between your own bases
  with no convoy to ambush, free to fire from mission start, and the
  placement warning on load listed them as misplaced groups.
watch: >-
  With Disable land convoys ticked and the fog reveal on, no red vehicle
  group sits on a road between your bases after you pass a turn. Loading a
  save shows no placement warning for groups you cannot see.
