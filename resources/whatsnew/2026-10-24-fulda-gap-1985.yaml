date: 2026-10-24
title: New campaign - Fulda Gap 1985
change: >-
  The Central Front in September 1985 on the Germany Cold War map. The
  52nd Tactical Fighter Wing's Phantoms fly from Spangdahlem with the
  Eagles at Bitburg, A-10s at Frankfurt, and Luftwaffe and RAF Germany
  squadrons. The 8th Guards Army comes through the Fulda Gap, the Werra
  valley and the Meiningen road, with the 16th Air Army and the East German
  air force behind it. Take Erfurt and Merseburg to win; lose Frankfurt and
  you lose. Stock DCS only.
watch: >-
  Three front lines open, at Fulda, Fritzlar and Schweinfurt.
