date: 2026-10-18
title: Campaigns no longer use the EA-6B Prowler mod
change: >-
  The eight campaigns that turned on the EA-6B Prowler mod no longer do,
  and each loses its Prowler squadron: Anatolian Reach, Gran Polvorin,
  Desert Storm, Inherent Resolve, Operation Blackball, Pacific Repartee,
  Scenic Merge and Scenic Route. The mod can still be turned on in the
  New Game wizard. Games already started keep their squadrons.
watch: >-
  A new game in one of these campaigns has no EA-6B in its air wing.
