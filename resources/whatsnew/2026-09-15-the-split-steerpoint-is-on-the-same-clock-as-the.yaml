date: 2026-09-15
title: The split steerpoint is on the same clock as the legs after it
change: >-
  The split time charged 45 seconds per target point over the target, and
  the refuel, RTB and landing times did not, so those ran early by the
  whole dwell. On the card that read as one slow leg into the split and
  one impossible leg out of it, and the tanker ETA could land before the
  split. The leg out of the target now carries the dwell on both clocks.
watch: >-
  On a strike or DEAD card, the leg after SPLIT should read near cruise
  speed, not 700 kt plus, and the REFUEL time should be after the SPLIT
  time. The jet's own steerpoint ETAs should agree with the card.
