date: 2026-10-26
title: ABCCC waits for the bombs before egress
change: >-
  The ABCCC calls each AI strike flight off target as it leaves, and calls
  "all flights off target, egress" only when every jet is clear and every
  bomb and standoff weapon from the package has landed. Tell it "off
  target" when you are off; it answers "copy off, cleared egress". The
  call is on the ABCCC kneeboard card.
watch: >-
  An egress call while a wingman is still on the target or a weapon is
  still falling, or a "say again" to your off-target call.
