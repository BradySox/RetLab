date: 2026-09-29
title: Iranian missile sites come from the RetLab Iran pack
change: >-
  With the RetLab Iran Air Defense Pack ticked, Iranian missile sites field
  the pack's own Sejjil-2, Emad, Kheibar, Fattah-2 and Shahed 238
  launchers. The separate Iranian missile mods tick box is gone, and those
  three third-party mods are no longer needed. Scenic Route Merged and both
  Noisy Crickets now tick the pack for you.
watch: >-
  An Iranian missile site should spawn with [IRAD] launchers and fire once
  at a blue field. A Shahed 238 is slow and takes most of the mission to
  arrive.
