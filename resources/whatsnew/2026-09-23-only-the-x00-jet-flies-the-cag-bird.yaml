date: 2026-09-23
title: Only the X00 jet flies the CAG bird
change: >-
  A Tomcat's painted number is its livery, and each jet now wears the
  livery for its own board number where the squadron has one. The CAG /
  hi-vis livery goes to the X00 jet and never to a line jet; a squadron
  with one CAG and one line livery puts the line livery on every other jet.
watch: >-
  A VF-143 F-14B(U) four-ship: jet 100 in AG100, the other three in AG106.
  No jet but 100 shows the CAG paint.
row: B138
