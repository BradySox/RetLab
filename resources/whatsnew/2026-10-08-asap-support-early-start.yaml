date: 2026-10-08
title: Tankers launch with an early mission start
change: >-
  When a flight needs the mission to start early, ASAP tankers, AWACS
  and the first CAP wave now launch at that earlier start instead of
  waiting for the turn's clock.
watch: >-
  A flight ticked Refuel before the push finds its tanker already on
  station when it gets there.
