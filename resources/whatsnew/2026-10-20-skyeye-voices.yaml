date: 2026-10-20
title: The AWACS and the ABCCC sound like their crews
change: >-
  With SkyEye's extra voices installed, the AWACS and the ABCCC each speak in
  an accent from their squadron's country: American, British, or English with
  an Arabic or Spanish accent. They are
  never the same voice. Without the extra voices SkyEye uses its own two.
watch: >-
  An RAF E-3 should sound British and a Saudi one Arabic-accented.
