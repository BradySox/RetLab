date: 2026-10-18
title: Phantom and Intruder squadrons wear with use
change: >-
  An F-4E or A-6E squadron that flies hard now hands its players more worn
  jets. Hours flown raise the squadron's Wear and Tear, and each turn
  brings it back down, so a squadron that stands down recovers. It never
  goes past 50, half of Heatblur's due-for-maintenance point.
watch: >-
  After a busy few turns a new F-4E flight shows a higher Aircraft Wear
  and Tear on the Payload tab. A value you set there still wins.
