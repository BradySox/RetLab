date: 2026-09-22
title: UH-60L, OH-6, JAS 39, Frenchpack and Spanish navy toggles are back
change: >-
  The New Game Mods page lists them again. Without a toggle their units
  were stripped from every new game, even where the campaign turns them on.
watch: >-
  Start a new game of a campaign that flies the UH-60L: the Mods page should
  tick it for you, and its Black Hawk squadrons should be in the air wing.
