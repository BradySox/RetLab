date: 2026-10-24
title: Era-right carrier helos and supply ships
change: >-
  Before 1992 the carrier rescue helo is an SH-3W Sea King, not an
  SH-60B. Cold War US Navy factions can field SH-3W squadrons, and the
  Russian factions with the Kuznetsov can field the Ka-27 Helix. Supply
  ships now look like their navy's: Soviet and Russian factions sail the
  Bulker Yakushev, China, North Korea, Iran, Syria and Iraq the Cargo
  Ivanov, and the 1982 Falklands task force the Atlantic Conveyor.
watch: >-
  Watch the Sea King plane guard on a Cold War carrier: it should lift
  off, hold off the carrier's beam, and land back aboard.
