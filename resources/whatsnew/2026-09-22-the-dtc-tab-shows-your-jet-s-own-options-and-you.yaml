date: 2026-09-22
title: The DTC tab shows your jet's own options, and you can draw on the map
change: >-
  The DTC tab lists only what your aircraft's cartridge carries, with what
  each part does on that jet. New choices: load at spawn or by hand, which
  kinds of waypoint go into the jet, and SAM rings only near your route.
  Saved points can be waypoints, IPs, targets, holds or orbits, and the
  map's crosshair popup can draw lines and areas. The F-14B(U) and the
  Apache now load your points too.
watch: >-
  Set Pilot loads it on a Viper, untick Join, draw an area. In the jet the
  cartridge should wait for you, the join point should be gone with the
  numbers closed up, and the area should be on the HSD.
row: B136
