date: 2026-09-29
title: Naval gunfire hits your marker
change: >-
  In Vietnam Ops, Naval Fire Mission, then Fire on last F10 map marker, now
  shoots at the marker you placed. Before, a FAC(A) or Super Gaggle mark on
  the map took priority. The Super Gaggle's fast movers now carry their
  squadron's CAS load, and COIN mortar fire never lands on an airbase.
watch: >-
  Place a marker near the coast with a gun ship in range and call the fire
  mission. Watch the Super Gaggle's F-4s over the outpost: they should drop
  bombs.
row: B168
