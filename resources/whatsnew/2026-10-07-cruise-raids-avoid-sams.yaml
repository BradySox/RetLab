date: 2026-10-07
title: Cruise raids stay clear of defended SAMs
change: >-
  An automatic cruise missile raid no longer flies its Tomahawks past an
  enemy SAM site that has point defense. It picks the next-best target
  with a clear line, or keeps its missiles for another turn.
watch: >-
  The SA-10 still has its missiles when your strike package arrives,
  and no Tomahawk is shot down on the way to a raid target.
