date: 2026-11-06
title: Real SAM sites in Anatolian Reach
change: >-
  Anatolian Reach now has 41 real Syrian and Turkish SAM and radar sites, each launcher in the
  map's own revetment, from the Levant SAM template. Around Aleppo and Latakia you meet SA-2s,
  SA-3s, SA-6s and two SA-5s. Start a new game to get them.
watch: >-
  Check that the sites sit in their revetments and that AI jets still taxi at the Syrian fields.
