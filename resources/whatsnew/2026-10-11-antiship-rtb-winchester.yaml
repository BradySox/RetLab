date: 2026-10-11
title: Anti-ship flights turn for home after their last missile
change: >-
  An AI anti-ship flight that has fired every weapon now returns to
  base. Before, it flew the rest of its route: four B-52s that fired
  their Harpoons from about 83 NM ended 9 NM from the enemy carrier.
  A flight that still has a weapon left keeps flying its route.
watch: >-
  In Tacview, follow a B-52, Tu-22M3 or H-6J anti-ship flight: after
  the last missile leaves, every aircraft turns away and none comes
  within 40 NM of the ships.
