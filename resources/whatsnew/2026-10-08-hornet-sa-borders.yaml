date: 2026-10-08
title: Hornet SA page shows borders and your attack lane
change: >-
  The Hornet's SA page shows one item of each kind, so each slot now has
  one job. The nearest land border is the dashed line, the next border the
  solid line, and the front line shows only on CAS flights. Strike and SEAD
  flights get a lane from the IP over the target to the split. The data
  cartridge also lists the boats and your home, arrival and divert fields
  as TACAN stations.
watch: >-
  Near a border, the SA page shows a dashed and a solid border line, and a
  strike flight sees its attack lane as two parallel lines. With no border
  near the route, the dashed line is the tanker box, as before.
