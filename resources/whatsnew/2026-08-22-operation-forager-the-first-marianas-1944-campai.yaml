date: 2026-08-22
title: Operation Forager, the first Marianas 1944 campaign
change: >-
  A campaign on the new Marianas WWII terrain. Blue holds the Charan Kanoa
  beach strip on Saipan and a carrier; red holds the other nine fields
  across Saipan, Tinian, Rota and Guam. The islands connect to each other
  only by sea. Corsairs fly from the Essex and Thunderbolts from the beach
  strip, against Japanese flak batteries built from Japanese guns.
watch: >-
  Start it and look at the map. One blue field, one front line running
  north from the beachhead to Aslito, and no road off Saipan. Then check
  that your Corsair squadron is aboard the carrier and the Thunderbolts
  are ashore.
