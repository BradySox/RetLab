date: 2026-11-08
title: New campaign - Black Sea Landing 1985
change: >-
  A late Cold War war on the Caucasus map. In May 1985 NATO holds a beachhead
  at Batumi and Kobuleti with a Forrestal-class carrier offshore, and drives up
  the coast road to Poti, then inland along the main highway through Senaki,
  Kutaisi, Zestafoni, the Rikoti pass, Khashuri and Gori to Tbilisi. USAF
  F-4Es and F-15Cs fly from Kobuleti, F-14As and A-6Es from the carrier.
  The Soviets fly MiG-21s, MiG-23s, MiG-25s and one regiment of MiG-29s, with
  Backfires at Mozdok, and an SA-2, SA-3, SA-6 and SA-11 belt guards every
  town. Take Tbilisi and Vaziani to win; lose Kobuleti and you lose. Every
  unit is stock DCS.
watch: >-
  One front line forms, Kobuleti to Poti, and no SA-5 or SA-10 appears.
