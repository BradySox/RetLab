date: 2026-10-20
title: A C-130 command post runs your package
change: >-
  Turn on ABCCC C-130 (SkyEye) in Settings > RetLab Features. The
  planner adds a C-130J-30 ABCCC (Bookshelf, Anvil, Ramrod...) to the
  AWACS package. Check in with it on STRIKE, the common frequency on your
  kneeboard: it gives your hold altitude and push time, calls the push, holds
  the push if your SEAD or escort is not airborne, aborts if the target is
  already destroyed, and calls egress. The AI in your package follow its
  calls. The AWACS joins STRIKE only for threats and your own calls, in the
  other voice. Needs SkyEye running with its mission link.
watch: >-
  No package calls at all while the C-130 is on the ground or shot down.
