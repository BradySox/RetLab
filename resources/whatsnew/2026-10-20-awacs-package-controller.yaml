date: 2026-10-20
title: The AWACS runs your package over SRS
change: >-
  Turn on AWACS package controller in Settings > RetLab Features and run your
  SRS server. Check in from the F10 menu and the AWACS answers on your package
  frequency with your hold altitude and push time. It calls the push, holds
  the push up to twice if your SEAD or escort is not airborne, aborts if the
  target is already destroyed or the SEAD is lost, and calls egress when the
  strikers are clear. Each call also shows as text.
watch: >-
  The voice should come over SRS on your package frequency, in a male voice,
  without a stutter.
