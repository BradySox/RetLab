date: 2026-10-10
title: No second AWACS or tanker for a carrier that bases none
change: >-
  The planner gave every carrier its own AWACS and tanker station. A
  carrier with no such aircraft aboard had them flown from the nearest
  land base, which put two A-50s or two IL-78s on nearly the same
  track. Now a carrier gets a station only when a squadron aboard can
  fly it, and the land station covers the rest.
watch: >-
  In a campaign with a red carrier (Caucasus - Multi-Part Russia, Black
  Sea), red flies one A-50 and one IL-78, not two of each side by side.
  A US carrier still flies its own E-2 and tanker.
