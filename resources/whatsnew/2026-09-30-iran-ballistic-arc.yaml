date: 2026-09-30
title: Iranian ballistic missiles fly a real arc
change: >-
  With the RetLab Iran Air Defense Pack updated, the Sejjil-2, Emad, Kheibar
  and Fattah-2 climb steeply, arc high and dive onto the target instead of
  skimming in flat at 6,000 kt, and they no longer fly sideways. A missile
  site now fires only at a field 81-486 NM away.
watch: >-
  An Iranian missile should climb near-vertical, go very high and come down
  steeply on a blue field 9-11 minutes later.
