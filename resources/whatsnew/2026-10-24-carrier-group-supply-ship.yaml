date: 2026-10-24
title: Carrier groups bring a supply ship
change: >-
  New campaigns give every carrier and LHA group the faction's own supply
  ship. It sails as its own group astern of the carrier and its escorts,
  so the carrier keeps its speed for recoveries. It is a real ship that
  can be hit and sunk.
watch: >-
  At about 14 knots it falls behind the carrier during a mission. That
  is expected. Existing saves keep their carrier groups as they are.
