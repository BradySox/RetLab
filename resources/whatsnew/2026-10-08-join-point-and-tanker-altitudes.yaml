date: 2026-10-08
title: Shorter join-ups and separated tankers
change: >-
  A package's join and split points sit on the way to the target instead
  of on the edge of a far-off threat ring. Theater tankers from different
  packages now fly at different altitudes, 2,000 ft apart.
watch: >-
  On a long-range package, the join point lies roughly on the line from
  your base to the attack start. Two tankers whose boxes cross show
  different altitudes on the kneeboard.
