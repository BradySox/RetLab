date: 2026-10-11
title: Alert fighters scramble on what the AWACS sees
change: >-
  A side's alert (QRA) fighters used to launch only on contacts from its
  ground radars. A side with an AWACS up and no early warning radar never
  scrambled. The side's own AWACS now feeds the same picture.
watch: >-
  In a campaign where your side has an AWACS and no EWR site, let an enemy
  strike come at your bases: the alert jets launch. Shoot the enemy's only
  radar and AWACS and its alert jets stay on the ground.
