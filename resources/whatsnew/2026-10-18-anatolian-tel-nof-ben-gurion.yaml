date: 2026-10-18
title: Anatolian Reach adds Tel Nof and Ben Gurion
change: >-
  Two more Israeli bases. Tel Nof is home to both F-15C squadrons, the
  119th Squadron's F-4E Kurnass 2000 and the 114th Squadron's CH-53E. Ben
  Gurion has the 103rd Squadron's C-130J transports. New games only.
watch: >-
  A new Anatolian Reach game shows Tel Nof and Ben Gurion as blue fields
  with these squadrons in IAF paint.
