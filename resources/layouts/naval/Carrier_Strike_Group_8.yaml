name: Carrier Strike Group 8
generic: true
tasks:
  - AircraftCarrier
groups:
  - Carrier:
    - name: Carrier Strike Group 8 0
      unit_count:
        - 1
      unit_types:
        - Stennis
  # Cruiser-led screen: the Ticonderoga is the CSG's area-air-defence ship, and a
  # modern anti-ship salvo is survived by SM-2 magazine depth, not by hull count.
  # Explicit unit_types, so the naval mixing rule leaves this screen alone.
  - Escort:
    - name: Carrier Strike Group 8 1
      unit_count:
        - 3
      unit_types:
        - TICONDEROG
    - name: Carrier Strike Group 8 2
      unit_count:
        - 1
      unit_types:
        - USS_Arleigh_Burke_IIa
  # The faction's supply ship, in a DCS group of its own: at about 14 kt it
  # falls behind, and inside the escorts' group it would drag the screen away.
  - Supply:
    - name: Carrier Strike Group 8 3
      optional: true
      faction_supply_ship: true
      unit_count:
        - 1
      unit_classes:
        - Boat
        - LandingShip
