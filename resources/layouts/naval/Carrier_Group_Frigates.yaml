name: Carrier Group with Frigate escort
generic: true
tasks:
  - AircraftCarrier
groups:
  - Carrier:
    - name: Carrier Group 0
      unit_count:
        - 1
      unit_classes:
        - AircraftCarrier
  # The light-screen variant: frigate-led, no cruiser. Hulls inside the slot
  # are still mixed, so this is a lighter screen rather than four of one ship.
  - Escort:
    - name: Carrier Group 1
      unit_count:
        - 4
      unit_classes:
        - Frigate
        - Destroyer
  # The faction's supply ship, in a DCS group of its own: at about 14 kt it
  # falls behind, and inside the escorts' group it would drag the screen away.
  - Supply:
    - name: Carrier Group 2
      optional: true
      faction_supply_ship: true
      unit_count:
        - 1
      unit_classes:
        - Boat
        - LandingShip
