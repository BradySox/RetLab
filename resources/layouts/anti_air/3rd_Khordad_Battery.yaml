name: 3rd Khordad Battery
tasks:
  - MERAD
groups:
  - SAM: # Main Battery as one group
    - name: Search Radar
      unit_count:
        - 1
      unit_types:
        - IRAD_Bashir_SR
    # The TELAR carries the fire-control radar, so it fills the guidance slot.
    - name: Track Radar
      unit_count:
        - 2 # RetLab: guidance-radar redundancy - one HARM must not blind the site
      unit_types:
        - IRAD_3Khordad_TELAR
    - name: Launcher
      unit_count:
        - 4
      unit_types:
        - IRAD_AlamAlHoda_TEL
    - name: Logistics
      optional: true
      unit_count:
        - 1
        - 2
      unit_classes:
        - Logistics
    # RetLab: the battery's refuelling section (preset-carried; fill:false so a
    # faction's trucks are never displaced from the Logistics slot).
    - name: Fuel
      optional: true
      fill: false
      unit_count:
        - 1
        - 2
      unit_types:
        - ATZ-5
        - ATZ-60_Maz
        - TZ-22_KrAZ
        - ATMZ-5
        - ATZ-10
        - M978 HEMTT Tanker
  - PD: # Point Defense as separate group
    - name: PD
      sub_task: PointDefense
      optional: true
      unit_count:
        - 0
        - 2
      unit_classes:
        - SHORAD
    - name: AAA
      sub_task: AAA
      optional: true
      unit_count:
        - 1
        - 2
      unit_classes:
        - AAA
layout_file: resources/layouts/anti_air/6_Launcher_Circle.miz
